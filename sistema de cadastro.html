<body style="background-color: LightSteelBlue;">

<h1>Sistema de Cadastro</h1>
<p> Preencha todos os campos abaixo para concluir o cadastro</p>
<fieldset><legend>Dados Pessoais</legend>

<label><strong></stron>Nome completo<font color=red >*</font> </strong> </label> 
<br><input type="text"  placeholder="Digite seu nome"maxlength="60"><br>

<br><label><strong>CPF <font color=red >*</font></strong> 
</label> 
<br><input type="text"  placeholder="000.000.000-00"maxlength="11">
<br>
<br>
<label><strong>Sexo<font color=red >*</font> </strong> </label> <br>
<select>
<option> Selecione</option>

</select>
<br>
<br>

    <font color=red >*</font>  </label> <br>
<input type="text"  placeholder="dd/mm/aaaa  "maxlength="8"><br>

<br>

<input type="text"  placeholder="Digite seu Rg  "><br>

<input type="text"  placeholder="(99) 99999-9999 ">
